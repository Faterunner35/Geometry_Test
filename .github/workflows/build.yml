name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC 2022
            os: windows-latest
          - name: Linux GCC
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash {0}
        run: |
          cmake --build build --config Release --parallel > build.log 2>&1
          status=$?
          cat build.log
          # compiler errors and warnings as annotations (visible in PRs and via the API)
          grep -E "error|warning C[0-9]+|warning:" build.log | sort -u | head -50 | while IFS= read -r line; do
            echo "::warning::${line}"
          done
          exit $status

      - name: Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run on sample data
        shell: bash
        run: |
          if [ -f build/Release/SegmentTest.exe ]; then
            build/Release/SegmentTest.exe data/Triangles.txt
          else
            build/SegmentTest data/Triangles.txt
          fi
